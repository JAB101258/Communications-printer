<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Communications Printer</title>
<style>
:root { --paper:#f1ead7; --ink:#181818; --metal:#6f706b; --dark:#20211f; --green:#b7d3ad; }
* { box-sizing:border-box; }
body { margin:0; background:#151615; color:#ddd; font-family:Georgia,serif; min-height:100vh; }
.wrap { max-width:900px; margin:auto; padding:18px; }
h1 { text-align:center; letter-spacing:5px; font-size:clamp(20px,4vw,34px); margin:8px 0 16px; color:#d7d4c8; }
.machine { background:linear-gradient(#777871,#555651); border:4px solid #30312f; border-radius:18px; padding:16px; box-shadow:0 10px 30px #0008, inset 0 1px #aaa; }
.rail { height:78px; background:linear-gradient(#252624,#3c3d39 48%,#1b1c1a 52%,#292a28); border:3px solid #171817; border-radius:10px; position:relative; margin-bottom:10px; overflow:hidden; box-shadow:inset 0 5px 10px #0008, inset 0 -4px 8px #0007; }
.rail:before { content:""; position:absolute; left:18px; right:18px; top:34px; height:9px; border-radius:5px; background:linear-gradient(#d0d0c9,#777872 45%,#bbbcb5 55%,#4b4c48); box-shadow:0 0 0 2px #111, 0 2px 5px #000; }
.rail:after { content:""; position:absolute; left:0; right:0; top:12px; height:1px; background:#aaa8; box-shadow:0 53px #aaa5; }
.carrier { position:absolute; top:17px; width:58px; height:52px; transform:translateX(-50%); z-index:3; pointer-events:none; transition:left .11s cubic-bezier(.22,.61,.36,1); }
.carrier:before { content:""; position:absolute; left:7px; right:7px; top:15px; height:34px; border-radius:7px 7px 10px 10px; background:linear-gradient(90deg,#444,#8b8c87 42%,#555 70%,#30312f); border:2px solid #222; box-shadow:0 3px 5px #0008; }
.ball { position:absolute; left:8px; top:0; width:42px; height:42px; border-radius:50%; background:radial-gradient(circle at 31% 27%,#f0f0ea 0 5%,#bfc0ba 18%,#777872 48%,#3b3c39 78%,#1f201e 100%); border:2px solid #1b1c1a; box-shadow:inset -5px -7px 10px #0007, inset 5px 4px 7px #fff5, 0 4px 7px #000b; transform-origin:50% 58%; will-change:transform; transition:transform .08s cubic-bezier(.22,.61,.36,1); }
@keyframes strike { 0%{transform:translateY(0) rotateX(0deg) rotateZ(0deg)} 30%{transform:translateY(7px) rotateX(-7deg) rotateZ(-2deg)} 65%{transform:translateY(2px) rotateX(4deg) rotateZ(2deg)} 100%{transform:translateY(0) rotateX(0deg) rotateZ(0deg)} }
.ball.strike { animation:strike .12s cubic-bezier(.2,.8,.2,1); }
.ball:before { content:"A  B  C  D  E  F  G  H  I  J  K  L"; position:absolute; left:-17px; top:14px; width:74px; height:10px; overflow:hidden; color:#252624; font:700 5px/10px Arial,sans-serif; letter-spacing:1px; white-space:nowrap; transform:rotate(-8deg); opacity:.72; }
.ball:after { content:"• • • • • • • • •"; position:absolute; left:5px; top:27px; color:#222; font:8px/8px Arial; letter-spacing:1px; opacity:.55; }
.paper { background:var(--paper); color:var(--ink); min-height:330px; padding:26px 22px; border:2px solid #bdb49f; box-shadow:inset 0 0 18px #0002; font-family:"Courier New",monospace; font-weight:700; font-size:clamp(14px,2.3vw,19px); line-height:1.55; white-space:pre-wrap; overflow:auto; }
.controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; justify-content:center; }
button { font:700 14px/1 Arial,sans-serif; letter-spacing:1px; padding:13px 16px; border-radius:8px; border:2px solid #252624; background:#aaa; color:#151615; min-width:135px; box-shadow:0 3px 0 #222; }
button:active { transform:translateY(2px); box-shadow:0 1px 0 #222; }
.status { text-align:center; margin-top:12px; font:12px monospace; color:#c7d5c2; min-height:18px; }
.note { text-align:center; color:#999; font:12px Arial,sans-serif; margin:12px 0 0; }
</style>
</head>
<body>
<div class="wrap">
<h1>COMMUNICATIONS PRINTER</h1>
<div class="machine">
  <div class="rail"><div id="carrier" class="carrier"><div id="ball" class="ball"></div></div></div>
  <div id="paper" class="paper">SYSTEM READY.
COMMUNICATIONS LINK ESTABLISHED.

</div>
  <div class="controls">
    <button id="sound">SOUND ON</button>
    <button id="print">PRINT NOW</button>
    <button id="pause">PAUSE AUTO</button>
    <button id="clear">CLEAR PAPER</button>
  </div>
  <div id="status" class="status">AUDIO: NOT ENABLED</div>
</div>
<div class="note">Retro printer simulation • sound requires one tap on SOUND ON</div>
</div>

<script>
const paper=document.getElementById('paper');
const ball=document.getElementById('ball');
const carrier=document.getElementById('carrier');
const status=document.getElementById('status');
const soundBtn=document.getElementById('sound');
const pauseBtn=document.getElementById('pause');
const clackSrc=document.getElementById('clack');
const whirr=document.getElementById('whirr');
const ding=document.getElementById('ding');

let soundOn=false, paused=false, printing=false, lastMinute=new Date().getMinutes();
const clacks=[];

function makeClackPool(){
  for(let i=0;i<5;i++){
    const a=clackSrc.cloneNode(true);
    a.preload='auto';
    document.body.appendChild(a);
    clacks.push(a);
  }
}
makeClackPool();

function unlockAudio(){
  // Deliberately use HTML5 audio rather than Web Audio. Safari/iPad requires
  // a user gesture before media playback is allowed.
  const p=ding.play();
  if(p && p.catch) p.catch(()=>{});
  setTimeout(()=>{ ding.pause(); ding.currentTime=0; },120);
  soundOn=true;
  soundBtn.textContent='SOUND OFF';
  status.textContent='AUDIO: ENABLED';
}

soundBtn.addEventListener('click',()=>{
  if(soundOn){
    soundOn=false;
    soundBtn.textContent='SOUND ON';
    status.textContent='AUDIO: OFF';
    return;
  }
  unlockAudio();
});

function playClack(){
  if(!soundOn) return;
  const a=clacks[Math.floor(Math.random()*clacks.length)];
  try{ a.currentTime=0; const p=a.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){}
}

function playWhirr(){
  if(!soundOn) return;
  try{ whirr.currentTime=0; const p=whirr.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){}
}

function playDing(){
  if(!soundOn) return;
  try{ ding.currentTime=0; const p=ding.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){}
}

function escapeText(s){ return s; }

let ballSpin=0;
let strikeTimer=null;

function setBallPosition(percent, active=false){
  const x=Math.max(4,Math.min(96,percent));
  carrier.style.left=x+'%';
  if(active){
    ballSpin += 24;
    ball.style.transform='rotateY('+ballSpin+'deg) rotateZ('+(Math.random()*10-5)+'deg)';
    ball.classList.remove('strike');
    void ball.offsetWidth;
    ball.classList.add('strike');
    clearTimeout(strikeTimer);
    strikeTimer=setTimeout(()=>ball.classList.remove('strike'),125);
  } else {
    ball.style.transform='rotateY('+ballSpin+'deg) rotateZ(0deg)';
  }
}

function printLine(text){
  if(printing || paused) return;
  printing=true;
  playWhirr();
  let i=0;
  const line=document.createTextNode('');
  paper.appendChild(line);
  const timer=setInterval(()=>{
    if(i<text.length){
      line.nodeValue += text[i];
      const progress=i/Math.max(1,text.length-1);
      setBallPosition(4+progress*92,text[i] !== ' ');
      if(text[i] !== ' ') playClack();
      paper.scrollTop=paper.scrollHeight;
      i++;
    } else {
      clearInterval(timer);
      setBallPosition(4,false);
      playDing();
      printing=false;
    }
  },38);
}

document.getElementById('print').addEventListener('click',()=>{
  printLine('THE CURRENT TIME IS '+new Date().toLocaleTimeString('en-GB')+'.   DATE '+new Date().toLocaleDateString('en-GB')+'.\n');
});

pauseBtn.addEventListener('click',()=>{
  paused=!paused;
  pauseBtn.textContent=paused?'RESUME AUTO':'PAUSE AUTO';
  status.textContent=paused?'AUTO PRINTING: PAUSED':'AUTO PRINTING: ACTIVE';
});

document.getElementById('clear').addEventListener('click',()=>{
  paper.textContent='';
  setBallPosition(4,false);
  status.textContent=soundOn?'AUDIO: ENABLED':'AUDIO: OFF';
});

setInterval(()=>{
  const now=new Date();
  if(now.getMinutes()!==lastMinute){
    lastMinute=now.getMinutes();
    printLine('THE CURRENT TIME IS '+now.toLocaleTimeString('en-GB')+'.   DATE '+now.toLocaleDateString('en-GB')+'.\n');
  }
},1000);
</script>
